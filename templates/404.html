{% extends "base.html" %}
{% block default_title %}Page not found · 404 · Kashvo{% endblock %}
{% block content %}
<section class="phero phero--center" style="padding:120px 0 140px">
  <div class="wrap">
    <span class="eyebrow">Error 404</span>
    <h1>This page went out of stock.</h1>
    <p class="lead" style="margin-bottom:32px">The link you followed may be old, mistyped, or removed.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn--primary btn--lg" href="{% url 'home' %}">Back to home</a>
      <a class="btn btn--light btn--lg" href="{% url 'blog' %}">Explore the blog</a>
    </div>
  </div>
</section>
{% endblock %}
{% block cta %}{% endblock %}
